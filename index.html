<style>

}

  --bg:#0F1520;--surface:#182030;--ink:#E8ECF4;--muted:#9AA7BC;--line:#2C3750;--accent:#7FB0F0;
  --t-bg:#12453F;--t-fg:#8FE3D6;--k-bg:#5A1F33;--k-fg:#FFB6CA;--l-bg:#5A4310;--l-fg:#F6D678;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1520;--surface:#182030;--ink:#E8ECF4;--muted:#9AA7BC;--line:#2C3750;--accent:#7FB0F0;
  --t-bg:#12453F;--t-fg:#8FE3D6;--k-bg:#5A1F33;--k-fg:#FFB6CA;--l-bg:#5A4310;--l-fg:#F6D678;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans)}
main{max-width:860px;margin:0 auto;padding:20px 16px 48px}
h1{font:600 1.55rem/1.25 var(--serif);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}

.row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;align-items:center}
.row .lbl{color:var(--muted);font-size:.9rem;min-width:62px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px}

.seg{position:relative;padding:2px 3px;border-radius:3px;border-bottom:2px solid transparent}
.seg[data-k]{cursor:pointer}
.seg[data-k=t]{background:var(--t-bg);color:var(--t-fg);border-bottom-style:solid;border-bottom-color:var(--t-fg)}
.seg[data-k=k]{background:var(--k-bg);color:var(--k-fg);border-bottom-style:double;border-bottom-width:4px;border-bottom-color:var(--k-fg)}
.seg[data-k=l]{background:var(--l-bg);color:var(--l-fg);border-bottom-style:dashed;border-bottom-color:var(--l-fg)}

.seg::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 4px);z-index:5;width:max-content;max-width:230px;
  background:var(--ink);color:var(--bg);font:400 .85rem/1.35 var(--sans);padding:6px 9px;border-radius:6px;display:none;pointer-events:none}
.seg[data-k]:hover::after,.seg[data-k]:focus-visible::after{display:block}
.hide-t .seg[data-k=t]::after,.hide-k .seg[data-k=k]::after,.hide-l .seg[data-k=l]::after{display:none!important}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}

.chip i{width:14px;height:14px;border-radius:3px;display:inline-block;border-bottom:3px solid}
.chip[data-k=t] i,.chip[data-b=a] i{background:var(--t-bg);border-color:var(--t-fg)}
.chip[data-k=k] i,.chip[data-b=d] i{background:var(--k-bg);border-color:var(--k-fg)}
.chip[data-k=l] i,.chip[data-b=e] i{background:var(--l-bg);border-color:var(--l-fg)}

.detail{min-height:92px;border-left:5px solid var(--line)}

.br{border-top:4px solid;border-radius:8px;background:var(--surface);padding:10px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.br[data-b=a]{border-top-color:var(--t-fg)}.br[data-b=d]{border-top-color:var(--k-fg)}.br[data-b=e]{border-top-color:var(--l-fg)}

.idea[aria-pressed=true]{color:var(--surface);border-color:transparent}
.br[data-b=a] .idea[aria-pressed=true]{background:var(--t-fg)}
.br[data-b=d] .idea[aria-pressed=true]{background:var(--k-fg)}
.br[data-b=e] .idea[aria-pressed=true]{background:var(--l-fg)}
.plan{margin-top:14px}
.plan h3{margin:0 0 6px;font-size:1rem}
.plan ul{margin:0;padding-left:20px}
.plan li{margin:3px 0}
.slot{border:2px dashed var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;min-height:64px}
.slot small{display:block;color:var(--muted);font-weight:700}
.slot.on{border-style:solid;border-color:var(--accent);font:400 1.05rem/1.55 var(--serif)}
.slot.on small{font-family:var(--sans)}
.piece{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font:400 1.02rem/1.5 var(--serif)}
.piece:hover{border-color:var(--accent)}
.piece.bad{animation:sh .3s;border-color:var(--k-fg)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.piece.bad{animation:none}}
.msg{min-height:26px;margin:6px 0;font-weight:700}
.done{background:var(--t-bg);color:var(--t-fg);border-radius:10px;padding:12px 16px;font:400 1.05rem/1.6 var(--serif);margin-top:10px}
.again{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input,.own-in,.fld textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.btn,.addrow button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;white-space:nowrap}
.btn.pri{background:var(--accent);color:var(--surface);border-color:transparent;font-weight:700}

.orow{display:flex;gap:4px}.orow .idea{flex:1}

.own-in{margin:2px 0 6px}
.fld{margin-bottom:12px}.fld label{font-weight:700;display:block;margin-bottom:4px}

.starters{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.starters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:.88rem}
.wc{color:var(--muted);font-size:.85rem}
#fbk,#ref2{margin-top:12px}
.fb h3{margin:0 0 6px;font-size:1rem}.fb h4{margin:0 0 2px;font-size:1rem}
.fb .part{border-left:5px solid var(--t-fg);padding:4px 12px;margin:10px 0}
.fb .part.bad{border-color:var(--l-fg)}
.fb .fix{font:italic 400 1rem/1.5 var(--serif);background:var(--bg);border-radius:6px;padding:6px 10px;margin-top:6px}
.fb ol,.fb ul{margin:4px 0 8px;padding-left:20px}
.lens{margin-bottom:14px}
.lens h3{margin:0 0 2px;font-size:1rem}
.lens .row{padding-top:8px;padding-bottom:4px}
.lq{margin-top:8px;border-left:5px solid var(--accent);padding:2px 12px}
.lq h4{margin:0;font-size:1rem}.lq ul{margin:4px 0 0;padding-left:20px}
.idea .ex{display:block;font-size:.88rem;font-style:italic;color:var(--muted);margin-top:3px}
.idea[aria-pressed=true] .ex{color:inherit;opacity:.92}
.addcol{display:grid;gap:6px;margin-top:8px}
.addcol input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.addcol button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px}
.voc{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.voc span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.9rem}
.voc.cov span{border-style:dashed;color:var(--muted)}
.voc.cov span.on{background:var(--accent);color:var(--surface);border-style:solid}
.plan h4{margin:12px 0 2px;font-size:1rem}
.qbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.qbtn[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 5px 0 0 var(--accent)}
.ws{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.ws h4{margin:0 0 6px;font-size:1rem}
.fld2{margin:8px 0}.fld2 label{display:block;font-weight:700;font-size:.92rem;margin-bottom:3px}
.fld2 input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.idea .tg{display:block;width:fit-content;font-size:.78rem;border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-top:4px;opacity:.85}
[hidden]{display:none!important}
</style>
</head>

<main>
  <h1>IELTS Writing Task 2</h1>
  <p class="sub">Chọn dạng đề, chủ đề và đề bài, rồi dùng hai tab bên dưới.</p>
  <div class="row" id="rt" role="group" aria-label="Essay type"></div>

    <p class="hint" id="exnote">Mỗi ví dụ là một chuỗi gợi ý: tình huống → nguyên nhân → tác động. Hãy dùng chuỗi này để viết thành câu đầy đủ.</p>
    <div class="branches" id="branches"></div>
    <div class="card plan" id="plan"></div>
  </section>

</main>

<script>

 l:"Giới hạn phạm vi của đề: bài viết chỉ bàn trong phạm vi này."};

var K1=["To what extent do you agree or disagree?","k"];

var DATA={Opinion:[
{n:"Education",p:[
 {s:["Some people believe that everyone has a right to have ",["access to university education","t"]," and the ",["governments","l","Chính phủ là bên chi trả, không phải gia đình hay trường học."]," should make it ",["free","t"]," for ",["all students no matter what financial background they have","l","Áp dụng cho mọi sinh viên, kể cả gia đình giàu. Đây là điểm dễ phản bác."],". ",K1],},

{n:"Art",p:[
 {s:[["Art classes, such as painting and drawing","t"],", are ",["as important to a child's development as other subjects","l","So sánh ngang bằng với các môn khác: phải nói rõ có ngang bằng hay không."],", so it should be ",["compulsory in high schools","l","Bắt buộc, và chỉ ở cấp trung học phổ thông."],". ",K1],}]},
{n:"Family",p:[
 {s:[["Family","t"]," is a ",["powerful influence","l","Đề thừa nhận gia đình có ảnh hưởng mạnh. Câu hỏi là xã hội có lớn hơn không."]," on a child's life, whereas it is also believed that ",["society","t"]," plays ",["a bigger part","l","So sánh: xã hội có vai trò lớn hơn gia đình hay không?"]," for ",["children's development","t"],". ",K1],
  h:"Ở đề này, Agree nghĩa là đồng ý rằng xã hội có vai trò lớn hơn gia đình.",},
 {s:[["Parents","l","Người chịu trách nhiệm là phụ huynh."]," should ",["encourage","l","Chỉ khuyến khích, chưa phải bắt buộc."]," children to ",["spend less time on studying and more time on physical activities","t"],". ",K1],},{s:[["Some parents","l","Chỉ một số phụ huynh."]," try to ",["decide","l","Quyết định thay con, không chỉ định hướng."]," their children’s ",["future careers and personal choices","t"]," because they want them to become ",["good citizens and successful adults","t"],". However, they often ",["ignore their children’s own opinions and interests","l","Vế sau của đề: cha mẹ thường bỏ qua ý kiến và sở thích của con."]," ",["To what extent do you agree or disagree?","k"]],n:14,h:"Hãy xác định rõ bạn đồng ý đến mức nào. Agree = cha mẹ quyết định thay con là hợp lý vì lo cho tương lai của con; Disagree = con cái nên được tự quyết."}]},
{n:"Social issues",p:[
 {s:["It is a ",["natural process","l","Đề cho rằng tuyệt chủng là tự nhiên. Bạn cần xét có nên can thiệp hay không."]," for ",["animal species to become extinct","t"]," (e.g. dinosaurs, dodos). ",["There is no reason why people should try to prevent this","l","Khẳng định tuyệt đối ('không có lý do nào'). Chỉ cần một lý do hợp lý là có thể phản bác."]," from happening. ",K1],},

 {s:["Some people say that ",["most of the urgent problems","l","'Most', không phải 'all': có thể nêu cả vấn đề cần hợp tác quốc tế lẫn vấn đề giải quyết trong nước."]," can ",["only","l","'Chỉ có': khẳng định tuyệt đối, có thể phản bác bằng ví dụ giải quyết trong nước."]," be solved with ",["international cooperation","t"],". ",K1],},

{n:"Sport",p:[

{n:"Technology",p:[

{n:"Job",p:[

  var qs=pr?[["a",pr[1]],["d",pr[2]]]:[[null,L[2][0]],[null,L[2][1]]];

  box.appendChild(d);
  if(ws)box.appendChild(workspace());

function ideaBtn(t,e,on,fn,l){

function renderMap(fb){

  var S=sel[key()]=sel[key()]||{},o=O(),focusEl=null;
  var lg=$("mlegend");lg.innerHTML="";
  ["a","d"].forEach(function(b){
    var c=el("button","chip");c.dataset.b=b;c.setAttribute("aria-pressed",!mh[b]);

  });
  [["Gợi ý có sẵn",function(){showSug=!showSug;renderMap()},showSug],["Gợi ý ví dụ",function(){showEx=!showEx;renderMap()},showEx]].forEach(function(z){

  var bx=$("branches");bx.innerHTML="";

    if(showSug)p[b].forEach(function(x,i){
      var id=b+i;

    });
    o.list.filter(function(x){return x.b===b}).forEach(function(it){
      var r=el("div","orow"),del=el("button","x","×");del.setAttribute("aria-label","Xóa ý này");

      del.onclick=function(){o.list=o.list.filter(function(y){return y!==it});delete S[it.id];renderMap()};
      r.appendChild(del);d.appendChild(r);
    });
    var ar=el("div","addcol"),i1=el("input"),i2=el("input"),ab=el("button",null,"Thêm ý");

    var go=function(){var v=i1.value.trim();if(!v)return;var id="o"+(++o.n);o.list.push({id:id,b:b,t:v,e:i2.value.trim()});S[id]=1;renderMap(b)};
    ab.onclick=go;i1.onkeydown=i2.onkeydown=function(e){if(e.key==="Enter")go()};
    ar.appendChild(i1);ar.appendChild(i2);ar.appendChild(ab);d.appendChild(ar);

  var ul=el("ul"),cov={};

  pl.appendChild(ul);

  LENSES.forEach(function(l,i){cr.appendChild(el("span",cov[i]?"on":null,l[0]+(cov[i]?" ✓":"")))});
  pl.appendChild(cr);
